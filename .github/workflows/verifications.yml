# vérifs automatiques à chaque push : le site se construit, aucun lien cassé, score Lighthouse
name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Installer
        run: npm ci

      - name: Construire le site
        run: npm run build

      - name: Chercher les liens cassés
        uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn bloque les robots (code 999) : on ne le vérifie pas
          args: --root-dir "${{ github.workspace }}/dist" --no-progress --exclude "linkedin\.com" "dist/**/*.html"
          fail: true

      - name: Lighthouse (performance, accessibilité, SEO)
        uses: treosh/lighthouse-ci-action@v12
        with:
          staticDistDir: ./dist
          uploadArtifacts: true
          temporaryPublicStorage: true
